<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 – HOUSELINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#00466E;--navy-deep:#003457;--navy-mid:#005585;--navy-light:#006BA0;
  --green:#2D8B48;--green-light:#3AAD5C;--green-pale:#EBF7EF;
  --white:#FFFFFF;--off-white:#F4F6F8;
  --gray-50:#EEF1F4;--gray-100:#DDE3E8;--gray-200:#BEC8D0;
  --gray-300:#A8B6BF;--gray-400:#7E8F9A;--gray-600:#4A5A65;--text:#0D1F2D;
  --font-main:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-serif:var(--font-main);
}
body{font-family:var(--font-main);background:var(--off-white);color:var(--text);line-height:1.5;min-height:100vh;display:flex;flex-direction:column;}
a{text-decoration:none;color:inherit;}
/* ── Split layout ── */
.auth-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:100vh;}
/* ── Left panel ── */
.auth-left{background:linear-gradient(160deg,var(--navy-deep) 0%,var(--navy) 55%,#005585 100%);padding:clamp(44px,6.5vh,76px) clamp(40px,4.8vw,60px) clamp(44px,6.5vh,76px) clamp(48px,5.8vw,72px);display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:100%;}
.auth-left::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;}
.auth-left::after{content:'';position:absolute;bottom:-100px;right:-100px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(45,139,72,.18) 0%,transparent 70%);pointer-events:none;}
.al-body{flex:0 0 auto;min-height:0;position:relative;z-index:1;width:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;padding:0;}
.al-logo{flex-shrink:0;margin:0 0 50px 0;}
.al-logo a{display:inline-block;line-height:0;}
.al-logo-img{height:34px;width:auto;display:block;}
.al-headline{font-family:var(--font-serif);font-size:clamp(26px,2.8vw,40px);font-weight:600;color:#fff;line-height:1.22;letter-spacing:-.02em;margin:0 0 40px 0;}
.al-headline em{color:#7ED49A;font-style:normal;}
.al-sub{font-size:15px;color:rgba(255,255,255,.52);line-height:1.72;max-width:380px;margin:0 0 60px 0;}
.al-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0;width:100%;}
.als{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px 14px;text-align:left;}
.als-n{font-family:var(--font-serif);font-size:26px;font-weight:600;color:#7ED49A;line-height:1;}
.als-l{font-size:11.5px;color:rgba(255,255,255,.42);margin-top:4px;line-height:1.4;}
.al-footer{position:relative;z-index:1;width:100%;flex-shrink:0;margin-top:auto;padding-top:clamp(20px,3vh,32px);}
.al-trust{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.3);flex-wrap:wrap;}
.al-trust-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.18);flex-shrink:0;}
/* ── Right panel ── */
.auth-right{background:var(--white);display:flex;align-items:center;justify-content:center;padding:44px 36px;}
.auth-box{width:100%;max-width:420px;}
/* Language switcher */
.auth-lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:22px;}
.lbtn{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;border:1.5px solid var(--gray-100);background:var(--white);color:var(--gray-400);cursor:pointer;transition:all .15s;font-family:var(--font-main);}
.lbtn:hover{border-color:var(--navy);color:var(--navy);}
.lbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
/* Form header */
.auth-top{margin-bottom:26px;}
.auth-title{font-family:var(--font-serif);font-size:28px;font-weight:600;color:var(--navy);margin-bottom:6px;line-height:1.2;}
.auth-sub{font-size:14px;color:var(--gray-400);line-height:1.6;}
/* Form fields */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px;letter-spacing:.01em;}
.form-input{width:100%;padding:12px 14px;border:1.5px solid var(--gray-100);border-radius:9px;font-size:14.5px;font-family:var(--font-main);color:var(--text);background:var(--white);transition:border-color .2s,box-shadow .2s;outline:none;}
.form-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(45,139,72,.1);}
.form-input::placeholder{color:var(--gray-300);}
.input-wrap{position:relative;}
.input-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--gray-300);font-size:16px;user-select:none;padding:4px;transition:color .15s;}
.input-eye:hover{color:var(--gray-600);}
/* Row: remember + forgot */
.check-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.check-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-600);cursor:pointer;}
.check-label input{width:16px;height:16px;accent-color:var(--green);cursor:pointer;}
.forgot-link{font-size:13px;font-weight:600;color:var(--green);transition:color .15s;}
.forgot-link:hover{color:var(--navy);}
/* Buttons */
.btn-auth{width:100%;background:var(--green);color:#fff;font-size:15px;font-weight:700;padding:13px;border-radius:9px;border:none;cursor:pointer;transition:background .2s,transform .1s;font-family:var(--font-main);letter-spacing:.02em;}
.btn-auth:hover{background:#2a7d3f;}
.btn-auth:active{transform:scale(.99);}
.btn-google{width:100%;background:var(--white);color:var(--navy);font-size:14px;font-weight:600;padding:12px;border-radius:9px;border:1.5px solid var(--gray-100);cursor:pointer;transition:all .2s;font-family:var(--font-main);display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;}
.btn-google:hover{border-color:var(--green);color:var(--green);}
/* Divider */
.auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--gray-100);}
.auth-divider span{font-size:12px;color:var(--gray-300);font-weight:500;white-space:nowrap;}
/* Switch link */
.auth-switch{text-align:center;margin-top:20px;font-size:13.5px;color:var(--gray-400);}
.auth-switch a{font-weight:700;color:var(--green);transition:color .15s;}
.auth-switch a:hover{color:var(--navy);}
/* Back home */
.auth-back{text-align:center;margin-top:14px;}
.auth-back a{font-size:12.5px;color:var(--gray-300);transition:color .15s;}
.auth-back a:hover{color:var(--navy);}
/* Terms note */
.auth-terms{font-size:11.5px;color:var(--gray-300);text-align:center;margin-top:16px;line-height:1.6;}
.auth-terms a{color:var(--green);font-weight:600;}
/* Password strength */
.pw-strength{display:flex;gap:4px;align-items:center;margin-top:6px;}
.pw-bar{flex:1;height:3px;border-radius:100px;background:var(--gray-100);transition:background .3s;}
.pw-label{font-size:11px;color:var(--gray-400);margin-left:2px;}
/* Info box */
.info-box{background:var(--green-pale);border:1px solid rgba(45,139,72,.2);border-radius:9px;padding:14px 16px;font-size:13.5px;color:#166534;line-height:1.6;margin-bottom:22px;display:flex;gap:10px;align-items:flex-start;}
/* Select */
.form-select{width:100%;padding:12px 14px;border:1.5px solid var(--gray-100);border-radius:9px;font-size:14.5px;font-family:var(--font-main);color:var(--text);background:var(--white);outline:none;cursor:pointer;transition:border-color .2s;}
.form-select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(45,139,72,.1);}
/* Two-column form row */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:768px){
  .auth-wrap{grid-template-columns:1fr;}
  .auth-left{display:none;}
  .auth-right{padding:28px 20px;align-items:flex-start;}
  .auth-box{max-width:100%;padding-top:12px;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body data-hl-page="forgot">

<div class="auth-wrap">
  <div class="auth-left">
      <div class="al-logo"><a href="/zh/" target="_top" rel="noopener"><img src="/images/houselink-color-logo.png" alt="HOUSELINK" width="200" height="48" class="al-logo-img" decoding="async"></a></div>
      <div class="al-body">
        <div class="al-headline">越南第一<br><em>工业与建设</em><br>生态系统平台</div>
        <p class="al-sub">2,000+家领先企业通过HOUSELINK管理项目、连接合作伙伴并追踪市场动态。</p>
        <div class="al-stats">
          <div class="als"><div class="als-n">2,000+</div><div class="als-l">企业会员</div></div>
          <div class="als"><div class="als-n">120K+</div><div class="als-l">工厂数据库</div></div>
          <div class="als"><div class="als-n">500+</div><div class="als-l">工业园区</div></div>
          <div class="als"><div class="als-n">15+</div><div class="als-l">年经验</div></div>
        </div>
      </div>
      <div class="al-footer">
        <div class="al-trust">
          <!-- <span>依据第91/2025号法律保护</span><span class="al-trust-dot"></span>
          <span>端对端加密</span><span class="al-trust-dot"></span>
          <span>ISO 27001</span> -->
        </div>
      </div>
    </div>
  <div class="auth-right">
    <div class="auth-box">
      <div class="auth-lang">
<button type="button" class="lbtn" onclick="window.location.href='/vi/forgot/'">🇻🇳 VI</button>
<button type="button" class="lbtn" onclick="window.location.href='/forgot/'">🇬🇧 EN</button>
<button type="button" class="lbtn active" onclick="window.location.href='/zh/forgot/'">🇨🇳 ZH</button>
<button type="button" class="lbtn" onclick="window.location.href='/ko/forgot/'">🇰🇷 KO</button>
<button type="button" class="lbtn" onclick="window.location.href='/ja/forgot/'">🇯🇵 JA</button>
</div>
      <div class="auth-top">
        <h1 class="auth-title">忘记密码</h1>
        <p class="auth-sub">输入您注册的邮箱，我们将发送密码重置链接。</p>
      </div>
      <div class="info-box">
        <span style="font-size:18px;flex-shrink:0;">ℹ️</span>
        <span>说明将在2分钟内发送到您的邮箱。如果看不到，请检查垃圾邮件文件夹。</span>
      </div>
      <form class="hl-auth-form" novalidate>
        <div class="hl-auth-client-msg" role="alert" aria-live="polite"></div>
        <div class="form-group">
          <label class="form-label">邮箱</label>
          <input class="form-input" type="email" placeholder="email@company.com" autocomplete="email">
        </div>
        <button class="btn-auth" type="submit">发送重置链接</button>
      </form>
      <div class="auth-switch">记起密码了？ <a href="/zh/login/">登录</a></div>
      <div class="auth-back"><a href="/zh/">← 返回首页</a></div>
    
    </div>
  </div>
</div>

  <script src="../../js/auth-locale-validation.js" defer></script>
<script>
function togglePw(id,el){const i=document.getElementById(id);i.type=i.type==='password'?'text':'password';el.textContent=i.type==='password'?'👁':'🙈';}
function pwStrength(val){const bars=document.querySelectorAll('.pw-bar');const label=document.querySelector('.pw-label');if(!bars.length)return;let score=0;if(val.length>=8)score++;if(/[A-Z]/.test(val))score++;if(/[0-9]/.test(val))score++;if(/[^A-Za-z0-9]/.test(val))score++;const colors=['','#EF4444','#F59E0B','#F59E0B','#2D8B48'];const labels={'vi':['','Yếu','Trung bình','Khá','Mạnh'],'en':['','Weak','Fair','Good','Strong'],'zh':['','弱','中等','较强','强'],'ko':['','약함','보통','양호','강함'],'ja':['','弱い','普通','良い','強い']};const lang=document.documentElement.lang||'vi';const lmap=labels[lang]||labels['en'];bars.forEach((b,i)=>{b.style.background=i<score?colors[score]:'#DDE3E8';});if(label)label.textContent=lmap[score]||'';}
</script>

</body>
</html>
