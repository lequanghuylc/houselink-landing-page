<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 – ページが見つかりません | HOUSELINK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* ── HOUSELINK BRAND COLORS (extracted from official logo) ── */
  --navy: #00466E;        /* Brand primary — petroleum navy from logo */
  --navy-deep: #003457;   /* Darker variant */
  --navy-mid: #005585;    /* Lighter variant for gradients */
  --navy-light: #006BA0;  /* Hover/accent */

  --green: #2D8B48;       /* Logo icon green — primary accent */
  --green-light: #3AAD5C; /* Hover green */
  --green-pale: #EBF7EF;  /* Green tint background */
  --green-mid: #1E7038;   /* Deeper green */

  --teal: #1E6464;        /* Secondary teal from slides */
  --teal-light: #2A8080;  /* Lighter teal */

  /* Neutrals */
  --white: #FFFFFF;
  --off-white: #F4F6F8;
  --gray-50: #EEF1F4;
  --gray-100: #DDE3E8;
  --gray-200: #BEC8D0;
  --gray-400: #7E8F9A;
  --gray-600: #4A5A65;
  --text: #0D1F2D;

  --font-main: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-serif: var(--font-main);
  --header-h: 72px;
  --max-w: 1240px;
}
html { scroll-behavior: smooth; }
body { font-family: var(--font-main); color: var(--text); background: var(--white); overflow-x: hidden; line-height: 1.7; }

/* ── HEADER ── */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--header-h);
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--gray-100);
  transition: box-shadow 0.3s;
}
#header.scrolled { box-shadow: 0 2px 32px rgba(0,70,110,0.10); }
.header-inner {
  max-width: var(--max-w); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 100%; padding: 0 40px;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon {
  width: 38px; height: 38px; border-radius: 9px;
  background: var(--navy);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.logo-icon::before {
  content: 'H'; color: var(--green); font-weight: 900; font-size: 20px;
  font-family: var(--font-main); letter-spacing: -1px;
}
.logo-text-block {}
.logo-name { font-weight: 800; font-size: 17px; letter-spacing: 0.05em; color: var(--navy); text-transform: uppercase; display: block; line-height: 1; }
.logo-tagline { font-size: 9.5px; color: var(--gray-400); letter-spacing: 0.13em; text-transform: uppercase; display: block; margin-top: 2px; }

nav { display: flex; align-items: center; gap: 0; }
nav > a, .has-mega > a {
  font-size: 13.5px; font-weight: 500; color: var(--gray-600);
  text-decoration: none; padding: 8px 14px; border-radius: 7px;
  transition: all 0.18s; letter-spacing: 0.015em; cursor: pointer;
  display: block;
}
nav > a:hover, .has-mega > a:hover { color: var(--navy); background: var(--gray-50); }

.has-mega { position: relative; }
.mega-dropdown {
  display: none; position: absolute; top: calc(100% + 12px); left: 50%;
  transform: translateX(-50%);
  background: var(--white); border: 1px solid var(--gray-100);
  border-radius: 14px; box-shadow: 0 20px 60px rgba(0,70,110,0.12);
  padding: 20px; min-width: 580px;
  grid-template-columns: 1fr 1fr; gap: 6px;
}
.has-mega:hover .mega-dropdown { display: grid; animation: fadeD 0.18s ease; }
@keyframes fadeD { from{opacity:0;transform:translateX(-50%) translateY(-6px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
.mega-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 12px; border-radius: 9px; text-decoration: none; transition: background 0.15s;
}
.mega-item:hover { background: var(--gray-50); }
.mi-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--green-pale); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.mi-title { font-size: 12.5px; font-weight: 700; color: var(--navy); line-height: 1.3; }
.mi-desc { font-size: 11.5px; color: var(--gray-400); margin-top: 2px; line-height: 1.4; }

.hdr-actions { display: flex; align-items: center; gap: 10px; }
.btn-ghost { font-size: 13px; font-weight: 600; color: var(--navy); border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 8px 18px; text-decoration: none; transition: all 0.18s; }
.btn-ghost:hover { border-color: var(--navy); }
.btn-navy { font-size: 13px; font-weight: 600; color: var(--white); background: var(--navy); border-radius: 8px; padding: 9px 20px; text-decoration: none; border: 1.5px solid var(--navy); transition: all 0.18s; }
.btn-navy:hover { background: var(--navy-mid); border-color: var(--navy-mid); }

/* ── HERO ── */
#hero {
  padding-top: var(--header-h);
  min-height: 100vh;
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--navy);
  position: relative; overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 70% at 75% 50%, rgba(45,139,72,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 20% 80%, rgba(45,139,72,0.06) 0%, transparent 50%);
}
.hero-dots {
  position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
}
.hero-content {
  position: relative; z-index: 2;
  padding: 72px 56px 72px 72px;
  display: flex; flex-direction: column; justify-content: center;
  max-width: 660px;
}
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(45,139,72,0.15); border: 1px solid rgba(45,139,72,0.35);
  border-radius: 100px; padding: 5px 16px;
  font-size: 11px; font-weight: 700; color: #7ED49A;
  letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 28px; width: fit-content;
}
.hero-eyebrow::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; }
h1.hero-h1 {
  font-family: var(--font-serif);
  font-size: clamp(28px, 3.4vw, 46px);
  font-weight: 600; color: var(--white);
  line-height: 1.18; letter-spacing: -0.02em; margin-bottom: 12px;
}
.hero-h1 em { color: var(--green-light); font-style: normal; }
.hero-platform {
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5);
  letter-spacing: 0.08em; text-transform: uppercase;
  border-left: 2px solid var(--green-light); padding-left: 12px;
  margin-bottom: 24px;
}
.hero-sub { font-size: 15.5px; color: rgba(255,255,255,0.62); line-height: 1.7; max-width: 480px; margin-bottom: 36px; }
.hero-services-row {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 40px;
}
.hero-svc-tag {
  font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,0.65);
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 100px; padding: 5px 14px; letter-spacing: 0.03em;
}
.hero-actions { display: flex; align-items: center; gap: 16px; margin-bottom: 52px; }
.btn-gold {
  background: var(--green); color: var(--white);
  font-size: 13.5px; font-weight: 700; letter-spacing: 0.04em;
  padding: 13px 28px; border-radius: 8px; text-decoration: none;
  transition: all 0.18s; border: 2px solid var(--green);
}
.btn-gold:hover { background: var(--green-light); border-color: var(--green-light); }
.btn-video {
  color: rgba(255,255,255,0.75); font-size: 13.5px; font-weight: 500;
  text-decoration: none; display: flex; align-items: center; gap: 10px; transition: color 0.18s;
}
.btn-video:hover { color: var(--white); }
.play-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
}
.play-btn::after { content:'▶'; font-size: 12px; margin-left: 2px; }
.hero-stats {
  display: flex; gap: 36px;
  border-top: 1px solid rgba(255,255,255,0.1); padding-top: 32px;
}
.stat-n { font-family: var(--font-serif); font-size: 30px; font-weight: 600; color: #7ED49A; line-height: 1; }
.stat-l { font-size: 11.5px; color: rgba(255,255,255,0.45); margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.4; }

.hero-visual { position: relative; overflow: hidden; }
.hero-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.55) saturate(0.75); }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(to right, var(--navy) 0%, rgba(0,70,110,0.3) 50%, transparent 100%); }
.hero-card-tl {
  position: absolute; top: 52px; right: 36px;
  background: rgba(255,255,255,0.07); backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 16px 20px;
  color: var(--white); min-width: 200px;
}
.hc-label { font-size: 10px; color: rgba(255,255,255,0.45); letter-spacing: 0.1em; text-transform: uppercase; }
.hc-val { font-size: 22px; font-weight: 800; color: #7ED49A; margin: 4px 0 2px; line-height: 1; }
.hc-sub { font-size: 11.5px; color: rgba(255,255,255,0.6); }
.hero-card-br {
  position: absolute; bottom: 48px; right: 36px;
  background: rgba(0,70,110,0.85); backdrop-filter: blur(16px);
  border: 1px solid rgba(45,139,72,0.25); border-radius: 12px; padding: 16px 20px;
  color: var(--white); min-width: 200px;
}

/* ── SECTION BASE ── */
.section { padding: 88px 0; }
.si { max-width: var(--max-w); margin: 0 auto; padding: 0 40px; }
.sec-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--green); margin-bottom: 10px; }
.sec-title { font-family: var(--font-serif); font-size: clamp(26px, 3.2vw, 42px); font-weight: 600; color: var(--navy); line-height: 1.22; letter-spacing: -0.02em; }
.sec-title em { color: var(--green); font-style: normal; }
.sec-sub { font-size: 15.5px; color: var(--gray-600); line-height: 1.72; max-width: 560px; margin-top: 14px; }
.flex-sb { display: flex; justify-content: space-between; align-items: flex-end; }

/* ── LOGO MARQUEE ── */
#logos { background: var(--off-white); padding: 28px 0; overflow: hidden; border-top: 1px solid var(--gray-100); border-bottom: 1px solid var(--gray-100); }
.logos-lbl { text-align: center; font-size: 11px; color: var(--gray-400); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px; }
.marquee-wrap { overflow: hidden; }
.marquee-track { display: flex; gap: 12px; width: max-content; animation: marquee 54s linear infinite; align-items: center; }
@keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.logo-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--white); border: 1px solid var(--gray-100);
  border-radius: 100px; padding: 9px 20px;
  font-size: 12.5px; font-weight: 700; color: var(--navy);
  letter-spacing: 0.03em; white-space: nowrap;
}
.lp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink:0; }

/* ── VALUE PROP (challenges) ── */
#value { background: var(--white); }
.value-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; margin-top: 52px; }
.challenge-table { display: flex; flex-direction: column; gap: 0; }
.chal-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0;
  border-bottom: 1px solid var(--gray-100);
  padding: 20px 0;
}
.chal-row:first-child { padding-top: 0; }
.chal-col-hdr { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray-400); padding-bottom: 8px; border-bottom: 2px solid var(--gray-100); }
.chal-col-hdr.right { color: var(--teal); }
.chal-item { font-size: 13.5px; color: var(--gray-600); line-height: 1.55; padding-right: 16px; }
.chal-item.solution { color: var(--navy); font-weight: 500; padding-right: 0; padding-left: 16px; border-left: 1px solid var(--gray-100); }
.value-right {}
.benefit-box {
  background: var(--navy); border-radius: 16px; padding: 36px 32px; color: var(--white); margin-bottom: 20px;
}
.benefit-box .sec-label { color: var(--green); }
.benefit-box .sec-title { color: var(--white); font-size: 26px; }
.benefit-list { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
.benefit-item { display: flex; gap: 12px; align-items: flex-start; }
.benefit-icon { font-size: 16px; margin-top: 1px; flex-shrink: 0; }
.benefit-text { font-size: 14px; color: rgba(255,255,255,0.75); line-height: 1.55; }
.benefit-text strong { color: var(--white); font-weight: 600; display: block; font-size: 14px; }

/* ── SERVICES ── */
#services { background: var(--off-white); }
.svc-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 36px 0 20px; }
.svc-tab {
  font-size: 12.5px; font-weight: 600; color: var(--gray-600);
  background: var(--white); border: 1px solid var(--gray-100);
  border-radius: 100px; padding: 7px 18px; cursor: pointer;
  transition: all 0.18s; text-decoration: none;
}
.svc-tab.active, .svc-tab:hover { background: var(--navy); color: var(--white); border-color: var(--navy); }
.svc-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 8px; }
.svc-card {
  background: var(--white); border: 1px solid var(--gray-100);
  border-radius: 16px; padding: 32px 28px;
  position: relative; overflow: hidden; transition: all 0.25s; cursor: pointer;
}
.svc-card:hover { box-shadow: 0 8px 36px rgba(0,70,110,0.09); transform: translateY(-3px); border-color: var(--gray-200); }
.svc-card.featured { background: var(--navy); border-color: var(--navy); }
.svc-card.featured .svc-num, .svc-card.featured .svc-title, .svc-card.featured .svc-desc, .svc-card.featured .svc-link { color: rgba(255,255,255,0.9); }
.svc-card.featured .svc-title { color: var(--white); }
.svc-card.featured .svc-icon { background: rgba(255,255,255,0.1); }
.svc-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; background: linear-gradient(90deg, var(--green), var(--navy-mid)); transform:scaleX(0); transform-origin:left; transition:transform 0.3s; }
.svc-card:hover::after { transform:scaleX(1); }
.svc-card.featured::after { background: var(--green); transform: scaleX(1); }
.svc-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--green-pale); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 20px; }
.svc-num { font-size: 10.5px; font-weight: 700; color: var(--gray-200); letter-spacing: 0.1em; margin-bottom: 8px; }
.svc-title { font-size: 16.5px; font-weight: 700; color: var(--navy); margin-bottom: 10px; line-height: 1.3; }
.svc-desc { font-size: 13.5px; color: var(--gray-600); line-height: 1.65; }
.svc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.svc-tag-pill {
  font-size: 11px; font-weight: 600; color: var(--teal);
  background: rgba(45,139,72,0.08); border-radius: 100px; padding: 3px 10px;
  letter-spacing: 0.03em;
}
.svc-card.featured .svc-tag-pill { color: var(--green-light); background: rgba(45,139,72,0.15); }
.svc-link { font-size: 12.5px; font-weight: 600; color: var(--green); text-decoration: none; margin-top: 16px; display: inline-flex; align-items: center; gap: 5px; transition: gap 0.2s; }
.svc-link:hover { gap: 9px; }


/* ── LANGUAGE SWITCHER ── */
.lang-switcher { display:flex; align-items:center; gap:4px; margin-right:4px; }
.lang-btn {
  font-size:12px; font-weight:700; letter-spacing:0.06em;
  color:var(--gray-400); background:none; border:none; cursor:pointer;
  padding:4px 6px; border-radius:5px; transition:all 0.15s;
  font-family:var(--font-main);
}
.lang-btn.active { color:var(--navy); background:var(--gray-50); }
.lang-btn:hover:not(.active) { color:var(--navy); }
.lang-sep { font-size:11px; color:var(--gray-200); }
.btn-login { display:flex; align-items:center; }

/* ── AUDIENCE SWITCHER ── */
#audience-switcher { background: var(--navy); padding: 56px 0 0; }
.aud-tabs { display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
.aud-tab {
  flex: 1; text-align: center; padding: 20px 24px;
  font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
  color: rgba(255,255,255,0.45); border-bottom: 3px solid transparent;
  cursor: pointer; transition: all 0.2s; text-transform: uppercase;
}
.aud-tab.active { color: var(--green-light); border-bottom-color: var(--green); }
.aud-tab:hover:not(.active) { color: rgba(255,255,255,0.75); }

/* ── CONTRACTOR/SUPPLIER SERVICES ── */
#for-contractors { background: var(--off-white); }
.segment-hero {
  background: linear-gradient(135deg, var(--navy) 0%, #003457 60%, #005585 100%);
  padding: 72px 0; position: relative; overflow: hidden;
}
.segment-hero::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 50% 80% at 90% 50%, rgba(45,139,72,0.12) 0%, transparent 60%);
}
.segment-hero-inner { max-width: var(--max-w); margin: 0 auto; padding: 0 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; position: relative; z-index: 1; }
.seg-label-alt { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #7ED49A; margin-bottom: 10px; }
.seg-title { font-family: var(--font-serif); font-size: clamp(28px, 3.2vw, 44px); font-weight: 600; color: var(--white); line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 16px; }
.seg-title em { color: var(--green-light); font-style: normal; }
.seg-sub { font-size: 15.5px; color: rgba(255,255,255,0.62); line-height: 1.7; margin-bottom: 32px; }
.seg-stats { display: flex; gap: 32px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.1); }
.seg-stat-n { font-family: var(--font-serif); font-size: 28px; font-weight: 600; color: #7ED49A; line-height: 1; }
.seg-stat-l { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
.seg-benefits-right { display: flex; flex-direction: column; gap: 16px; }
.seg-benefit-card {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; padding: 18px 20px;
  display: flex; align-items: flex-start; gap: 14px; transition: all 0.2s;
}
.seg-benefit-card:hover { background: rgba(45,139,72,0.12); border-color: rgba(45,139,72,0.3); }
.seg-benefit-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
.seg-benefit-title { font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 4px; }
.seg-benefit-desc { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.55; }

/* Contractor service cards */
.ctr-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 48px; }
.ctr-card {
  background: var(--white); border: 1px solid var(--gray-100);
  border-radius: 16px; padding: 30px 26px; transition: all 0.25s; position: relative; overflow: hidden;
}
.ctr-card:hover { box-shadow: 0 8px 36px rgba(0,70,110,0.09); transform: translateY(-3px); border-color: var(--gray-200); }
.ctr-card.featured-ctr { background: var(--navy); border-color: var(--navy); }
.ctr-card.featured-ctr .ctr-num, .ctr-card.featured-ctr .ctr-title, .ctr-card.featured-ctr .ctr-desc { color: rgba(255,255,255,0.85); }
.ctr-card.featured-ctr .ctr-title { color: var(--white); }
.ctr-card.featured-ctr .ctr-icon { background: rgba(255,255,255,0.1); }
.ctr-card.featured-ctr .ctr-tag-pill { background: rgba(45,139,72,0.15); color: var(--green-light); }
.ctr-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; background: linear-gradient(90deg, var(--green), var(--teal)); transform:scaleX(0); transform-origin:left; transition:transform 0.3s; }
.ctr-card:not(.featured-ctr):hover::after { transform:scaleX(1); }
.ctr-card.featured-ctr::after { background: var(--green); transform: scaleX(1); }
.ctr-icon { width: 46px; height: 46px; border-radius: 11px; background: var(--green-pale); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 18px; }
.ctr-num { font-size: 10px; font-weight: 700; color: var(--gray-200); letter-spacing: 0.1em; margin-bottom: 8px; }
.ctr-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 10px; line-height: 1.3; }
.ctr-desc { font-size: 13.5px; color: var(--gray-600); line-height: 1.65; }
.ctr-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.ctr-tag-pill { font-size: 11px; font-weight: 600; color: var(--teal); background: rgba(45,139,72,0.08); border-radius: 100px; padding: 3px 10px; }

/* How it works flow */
.flow-steps { display: grid; grid-template-columns: repeat(5,1fr); gap: 0; margin-top: 52px; position: relative; }
.flow-steps::before { content:''; position:absolute; top:22px; left:10%; right:10%; height:1px; background:var(--gray-100); z-index:0; }
.flow-step { text-align: center; padding: 0 10px; position: relative; z-index:1; }
.flow-circle {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--white); border: 2px solid var(--gray-100);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px; font-size: 15px; font-weight: 800; color: var(--gray-200);
  transition: all 0.25s;
}
.flow-step:hover .flow-circle { border-color: var(--green); color: var(--green); background: var(--green-pale); }
.flow-title { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.flow-desc { font-size: 12px; color: var(--gray-600); line-height: 1.55; }

/* Membership tiers */
.tiers-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 48px; }
.tier-card {
  border: 1px solid var(--gray-100); border-radius: 16px; padding: 32px 28px;
  transition: all 0.25s; position: relative;
}
.tier-card.recommended { border: 2px solid var(--green); background: var(--green-pale); }
.tier-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--green); color: var(--white); font-size: 11px; font-weight: 800; padding: 4px 16px; border-radius: 100px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.tier-icon { font-size: 32px; margin-bottom: 16px; }
.tier-name { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--navy); margin-bottom: 6px; }
.tier-title { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
.tier-desc { font-size: 13.5px; color: var(--gray-600); line-height: 1.65; margin-bottom: 20px; }
.tier-features { display: flex; flex-direction: column; gap: 9px; }
.tier-feat { display: flex; gap: 10px; font-size: 13px; color: var(--gray-700); align-items: flex-start; }
.feat-check { color: var(--green); font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.tier-cta { margin-top: 24px; display: block; text-align: center; }

/* ── DATABASE STATS ── */
#database { background: var(--navy); color: var(--white); }
.db-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: center; }
.db-left {}
.db-left .sec-label { color: #7ED49A; }
.db-left .sec-title { color: var(--white); }
.db-left .sec-sub { color: rgba(255,255,255,0.6); max-width: 460px; }
.db-kv-list { display: flex; flex-direction: column; gap: 0; margin-top: 40px; }
.db-kv {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.08); padding: 18px 0;
}
.db-kv:first-child { padding-top: 0; }
.db-kv-label { font-size: 14px; color: rgba(255,255,255,0.55); font-weight: 400; }
.db-kv-value { font-family: var(--font-serif); font-size: 28px; font-weight: 600; color: #7ED49A; }
.db-right { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.db-card {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px; padding: 24px 20px; text-align: center;
  transition: all 0.25s;
}
.db-card:hover { background: rgba(45,139,72,0.12); border-color: rgba(45,139,72,0.3); }
.db-card-n { font-family: var(--font-serif); font-size: 36px; font-weight: 600; color: #7ED49A; line-height: 1; }
.db-card-l { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 6px; letter-spacing: 0.04em; line-height: 1.4; }
.db-card-icon { font-size: 22px; margin-bottom: 10px; }

/* ── PROCESS ── */
#process { background: var(--white); }
.process-track { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; margin-top: 60px; position: relative; }
.process-track::before { content:''; position:absolute; top:26px; left:12.5%; right:12.5%; height:1px; background:var(--gray-100); z-index:0; }
.proc-step { text-align: center; padding: 0 20px; position: relative; z-index:1; }
.proc-circle {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--white); border: 2px solid var(--gray-100);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 22px; font-size: 17px; font-weight: 800; color: var(--gray-200);
  transition: all 0.25s;
}
.proc-step:hover .proc-circle { border-color: var(--teal); color: var(--teal); background: rgba(45,139,72,0.06); }
.proc-title { font-size: 14.5px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.proc-desc { font-size: 13px; color: var(--gray-600); line-height: 1.6; }

/* ── METHODOLOGY ── */
#method { background: var(--off-white); }
.method-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-top: 52px; }
.method-card {
  background: var(--white); border: 1px solid var(--gray-100);
  border-radius: 14px; padding: 28px 22px; text-align: center; transition: all 0.2s;
}
.method-card:hover { box-shadow: 0 6px 24px rgba(0,70,110,0.07); border-color: var(--gray-200); transform: translateY(-2px); }
.method-step { width: 36px; height: 36px; border-radius: 50%; background: var(--navy); color: #7ED49A; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.method-icon { font-size: 24px; margin-bottom: 10px; }
.method-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 8px; line-height: 1.3; }
.method-desc { font-size: 12.5px; color: var(--gray-600); line-height: 1.6; }

/* ── CASE STUDIES ── */
#cases { background: var(--white); }
.cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 52px; }
.case-card {
  border: 1px solid var(--gray-100); border-radius: 16px; overflow: hidden;
  transition: all 0.25s;
}
.case-card:hover { box-shadow: 0 10px 40px rgba(0,70,110,0.09); transform: translateY(-3px); }
.case-img { width: 100%; height: 200px; object-fit: cover; display: block; }
.case-body { padding: 28px 28px 24px; }
.case-tag { font-size: 11px; font-weight: 700; color: var(--teal); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
.case-title { font-size: 17px; font-weight: 700; color: var(--navy); line-height: 1.3; margin-bottom: 12px; }
.case-challenge { font-size: 13.5px; color: var(--gray-600); line-height: 1.6; margin-bottom: 16px; }
.case-results { display: flex; flex-direction: column; gap: 6px; }
.case-result-item { display: flex; gap: 8px; font-size: 13px; color: var(--gray-600); }
.result-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink:0; margin-top: 7px; }
.case-clients-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; border-top: 1px solid var(--gray-50); padding-top: 14px; }
.case-client-tag { font-size: 11.5px; font-weight: 600; color: var(--navy); background: var(--gray-50); border-radius: 100px; padding: 4px 12px; }

/* ── COMMUNITY ── */
#community { background: var(--off-white); }
.community-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; margin-top: 52px; }
.comm-card {
  background: var(--white); border: 1px solid var(--gray-100);
  border-radius: 16px; overflow: hidden; transition: all 0.25s;
}
.comm-card:hover { box-shadow: 0 8px 32px rgba(0,70,110,0.08); transform: translateY(-2px); }
.comm-img { width:100%; height:180px; object-fit:cover; }
.comm-body { padding: 22px; }
.comm-tag { font-size: 11px; font-weight: 700; color: var(--green); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.comm-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 8px; line-height: 1.3; }
.comm-desc { font-size: 13px; color: var(--gray-600); line-height: 1.6; }

/* ── CUSTOMERS LOGOS ── */
#customers { background: var(--white); }
.customers-logo-grid {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 44px; justify-content: center;
}
.cust-logo {
  font-size: 12px; font-weight: 700; color: var(--gray-400);
  background: var(--gray-50); border: 1px solid var(--gray-100);
  border-radius: 8px; padding: 10px 18px;
  letter-spacing: 0.04em; transition: all 0.18s;
}
.cust-logo:hover { color: var(--navy); background: var(--white); border-color: var(--gray-200); }

/* ── INSIGHTS ── */
#insights { background: var(--off-white); }
.insights-grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 22px; margin-top: 52px; }
.insight-card {
  background: var(--white); border: 1px solid var(--gray-100);
  border-radius: 14px; overflow: hidden; transition: all 0.25s;
}
.insight-card:hover { box-shadow: 0 8px 32px rgba(0,70,110,0.08); transform: translateY(-3px); }
.insight-img { width:100%; height:220px; object-fit:cover; }
.insight-img-tall { height:280px; }
.insight-body { padding: 22px; }
.insight-tag { font-size: 11px; font-weight: 700; color: var(--navy); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.insight-title { font-size: 15.5px; font-weight: 700; color: var(--navy); line-height: 1.35; margin-bottom: 8px; }
.insight-date { font-size: 12px; color: var(--gray-400); }
.insight-desc { font-size: 13px; color: var(--gray-600); line-height: 1.6; margin-top: 8px; }

/* ── CTA BANNER ── */
#cta-strip {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 50%, var(--navy-mid) 100%);
  padding: 80px 0;
}
.cta-inner { max-width: 820px; margin: 0 auto; padding: 0 40px; text-align: center; }
.cta-inner h2 { font-family: var(--font-serif); font-size: clamp(26px, 3vw, 40px); font-weight: 600; color: var(--white); line-height: 1.22; margin-bottom: 14px; }
.cta-inner p { font-size: 15.5px; color: rgba(255,255,255,0.68); margin-bottom: 36px; line-height: 1.65; }
.cta-actions { display: flex; justify-content: center; gap: 14px; }
.btn-cta-gold { background: var(--green); color: var(--white); font-size: 14px; font-weight: 700; padding: 14px 32px; border-radius: 8px; text-decoration: none; letter-spacing: 0.03em; transition: all 0.18s; }
.btn-cta-gold:hover { background: var(--green-light); }
.btn-cta-wht { background: rgba(255,255,255,0.1); color: var(--white); border: 1.5px solid rgba(255,255,255,0.3); font-size: 14px; font-weight: 600; padding: 14px 32px; border-radius: 8px; text-decoration: none; transition: all 0.18s; }
.btn-cta-wht:hover { background: rgba(255,255,255,0.18); }

/* ── FOOTER ── */
footer { background: var(--navy); color: rgba(255,255,255,0.55); padding: 72px 0 40px; }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; margin-bottom: 56px; }
.ftr-logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.ftr-logo-name { font-weight: 800; font-size: 16px; letter-spacing: 0.05em; color: var(--white); text-transform: uppercase; display: block; line-height:1; }
.ftr-tagline { font-size: 9.5px; color: rgba(255,255,255,0.35); letter-spacing: 0.13em; text-transform: uppercase; display: block; margin-top: 2px; }
.ftr-desc { font-size: 13.5px; color: rgba(255,255,255,0.45); line-height: 1.7; max-width: 280px; }
.ftr-address { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.7; }
.social-row { display: flex; gap: 8px; margin-top: 20px; }
.soc-btn { width: 32px; height: 32px; border-radius: 8px; background: transparent; border: none; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 700; text-decoration: none; }
.ftr-col h4 { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 18px; }
.ftr-col a { display: block; font-size: 13.5px; color: rgba(255,255,255,0.6); text-decoration: none; margin-bottom: 9px; transition: color 0.18s; }
.ftr-col a:hover { color: var(--green-light); }
.ftr-bottom { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 28px; display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; }
.ftr-bottom a { color: rgba(255,255,255,0.35); text-decoration: none; transition: color 0.18s; }
.ftr-bottom a:hover { color: rgba(255,255,255,0.7); }

/* Mobile responsive */



/* ── SERVICE DETAIL LINK ── */
.svc-detail-link {
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:700; color:var(--green);
  text-decoration:none; margin-top:16px;
  letter-spacing:0.02em; transition:gap 0.2s;
  border-top:1px solid var(--gray-50); padding-top:14px;
  width:100%;
}
.svc-detail-link:hover { gap:10px; }
.svc-card.featured .svc-detail-link { color:#7ED49A; border-top-color:rgba(255,255,255,0.1); }
.ctr-detail-link {
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:700; color:var(--green);
  text-decoration:none; margin-top:14px;
  border-top:1px solid var(--gray-50); padding-top:12px;
  width:100%; transition:gap 0.2s;
}
.ctr-detail-link:hover { gap:10px; }
.ctr-card.featured-ctr .ctr-detail-link { color:#7ED49A; border-top-color:rgba(255,255,255,0.1); }

/* ── CHALLENGE ACCORDION PILLS ── */
.chal-compact { display:flex; flex-direction:column; gap:8px; }
.chal-pill {
  border:1px solid var(--gray-100); border-radius:10px;
  overflow:hidden; cursor:pointer; transition:all 0.2s;
  background:var(--white);
}
.chal-pill:hover { border-color:var(--green); }
.chal-pill.open { border-color:var(--green); }
.cp-head {
  display:flex; align-items:center; gap:10px;
  padding:13px 16px; font-size:13.5px; font-weight:600; color:var(--navy);
}
.cp-icon { font-size:16px; flex-shrink:0; }
.cp-title { flex:1; }
.cp-arrow {
  font-size:16px; color:var(--gray-400); transition:transform 0.2s;
  transform: rotate(0deg);
}
.chal-pill.open .cp-arrow { transform: rotate(90deg); color:var(--green); }
.cp-body {
  display:none; padding:0 16px 14px 42px;
  font-size:13px; color:var(--gray-600); line-height:1.6;
}
.chal-pill.open .cp-body { display:block; }
/* Benefit rows compact */
.b-row {
  display:flex; align-items:flex-start; gap:12px;
  padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.08);
}
.b-row:last-child { border-bottom:none; }
.b-ico { font-size:18px; flex-shrink:0; margin-top:2px; }
.b-row strong { display:block; font-size:13.5px; font-weight:700; color:var(--white); margin-bottom:2px; }
.b-row span { font-size:12.5px; color:rgba(255,255,255,0.5); }

/* ── DATABASE VISUAL ── */
.db-visual-grid {
  display: grid;
  grid-template-columns: 1fr 240px 1fr;
  grid-template-rows: auto auto auto;
  gap: 20px;
  align-items: center;
  position: relative;
  max-width: 900px;
  margin: 0 auto;
}
.db-visual-grid::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(45,139,72,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.dbv-center {
  grid-column: 2; grid-row: 1/4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 50%; width: 200px; height: 200px; margin: 0 auto;
  text-align: center; padding: 20px; position: relative; z-index: 2;
}
.dbv-logo-icon {
  width: 48px; height: 48px; border-radius: 10px;
  background: var(--navy-mid); border: 2px solid var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 900; color: var(--green);
  font-family: var(--font-main); margin: 0 auto 8px;
}
.dbv-logo-text {
  font-size: 11px; font-weight: 800; color: var(--white); letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.4;
}
.dbv-logo-text span { font-size: 8px; color: rgba(255,255,255,0.4); letter-spacing: 0.12em; }
.dbv-tagline { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 8px; line-height: 1.4; }
.dbv-stat {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px; padding: 20px 18px; text-align: center;
  transition: all 0.25s; position: relative; z-index: 1;
}
.dbv-stat:hover { background: rgba(45,139,72,0.1); border-color: rgba(45,139,72,0.3); transform: scale(1.02); }
.dbv-top-left  { grid-column:1; grid-row:1; }
.dbv-top-right { grid-column:3; grid-row:1; }
.dbv-mid-left  { grid-column:1; grid-row:2; }
.dbv-mid-right { grid-column:3; grid-row:2; }
.dbv-bot-left  { grid-column:1; grid-row:3; }
.dbv-bot-right { grid-column:3; grid-row:3; }
.dbv-n {
  font-family: var(--font-serif); font-size: 32px; font-weight: 600;
  color: #7ED49A; line-height: 1;
}
.dbv-n span { font-size: 18px; }
.dbv-icon { font-size: 20px; margin: 6px 0; }
.dbv-l { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5; }
@media (max-width:960px) {
  .db-visual-grid { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
  .dbv-center { display:none; }
  .dbv-top-left,.dbv-top-right,.dbv-mid-left,.dbv-mid-right,.dbv-bot-left,.dbv-bot-right {
    grid-column: auto; grid-row: auto;
  }
}

@media (max-width: 960px) {
  #hero { grid-template-columns: 1fr; }
  .hero-visual { display: none; }
  .hero-content { padding: 48px 28px; }
  .svc-grid, .db-grid, .cases-grid, .community-grid { grid-template-columns: 1fr; }
  .method-grid, .process-track { grid-template-columns: 1fr 1fr; }
  .process-track::before { display:none; }
  .insights-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .value-grid { grid-template-columns: 1fr; }
  .header-inner { padding: 0 20px; }
  nav { display: none; }
  .flex-sb { flex-direction: column; align-items: flex-start; gap: 20px; }
}


/* ── 404 SPECIFIC ── */
.err-wrap {
  min-height: calc(100vh - 72px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(160deg, var(--navy-deep) 0%, var(--navy) 55%, #005585 100%);
  position: relative;
  overflow: hidden;
  padding: 80px 40px;
}

/* Dot grid */
.err-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 30px 30px;
  pointer-events: none;
}

/* Glowing orbs */
.err-wrap::after {
  content: '';
  position: absolute;
  bottom: -180px;
  left: -100px;
  width: 480px;
  height: 480px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(45,139,72,.15) 0%, transparent 65%);
  pointer-events: none;
}
.orb-right {
  position: absolute;
  top: -120px;
  right: -80px;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,70,110,.35) 0%, transparent 65%);
  pointer-events: none;
}

.err-inner {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 640px;
}

/* Giant 404 */
.err-num {
  font-family: var(--font-serif);
  font-size: clamp(100px, 18vw, 180px);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -.04em;
  background: linear-gradient(135deg, rgba(255,255,255,.9) 0%, #7ED49A 60%, rgba(255,255,255,.5) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
  user-select: none;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-12px); }
}

.err-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #7ED49A;
  margin-bottom: 18px;
}

.err-title {
  font-family: var(--font-serif);
  font-size: clamp(22px, 3vw, 36px);
  font-weight: 600;
